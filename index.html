<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>YOGIBARA MAP</title>

<meta
  name="description"
  content="제주의 요가 공간과 나눔을 잇는 YOGIBARA MAP. 제주 요가원을 찾고 나만의 Jeju Yoga Journey를 만들어보세요."
>

<style>

:root{
  --bg:#f5f0e6;
  --paper:#fffdf8;
  --ink:#253830;
  --muted:#778079;
  --line:#ddd6c7;

  /* 일반 요가원 */
  --normal:#8b918c;

  /* YOGIBARA PARTNER */
  --partner:#7b7a45;

  /* BRAND PARTNER */
  --brand:#2f887a;

  /* 아난드 + 한주훈 특별 마커 */
  --special:#665b74;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Apple SD Gothic Neo",
  "Noto Sans KR",
  sans-serif;
}

button,
input{
  font:inherit;
}

.app{
  max-width:900px;
  margin:auto;
  min-height:100vh;
  background:var(--paper);
}


/* =====================================================
   HEADER
===================================================== */

header{
  padding:24px 18px 14px;
  border-bottom:1px solid var(--line);
  background:rgba(255,253,248,.97);
  position:relative;
  z-index:10;
}

.kicker{
  font-size:10px;
  font-weight:800;
  letter-spacing:.22em;
  color:var(--muted);
}

h1{
  font:500 34px Georgia,serif;
  margin:7px 0 4px;
}

.sub{
  font-size:12px;
  color:var(--muted);
  line-height:1.55;
}


/* =====================================================
   SEARCH
===================================================== */

.search-wrap{
  display:flex;
  gap:7px;
  margin-top:14px;
}

.search-wrap input{
  width:100%;
  min-width:0;

  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;

  padding:12px 15px;

  font-size:12px;
  color:var(--ink);

  outline:none;
}

.search-wrap input:focus{
  border-color:#999881;
}

.search-info{
  font-size:9px;
  color:var(--muted);
  margin:6px 3px 0;
}


/* =====================================================
   FILTER
===================================================== */

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;

  padding-bottom:3px;
  margin-top:9px;

  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.pill,
.btn,
.action,
.stop{
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);

  border-radius:999px;

  padding:9px 12px;

  font-size:11px;

  cursor:pointer;
}

.pill{
  flex:0 0 auto;
}

.pill.active,
.btn.primary,
.action.dark{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}


/* =====================================================
   LEGEND
===================================================== */

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:11px;

  margin-top:12px;

  color:var(--muted);
  font-size:9px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
}

.legend-dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.legend-dot.normal{
  background:var(--normal);
}

.legend-dot.partner{
  background:var(--partner);
}

.legend-dot.brand{
  background:var(--brand);
}

.legend-dot.special{
  background:var(--special);
  border-radius:3px;
  transform:rotate(45deg);
}


/* =====================================================
   MAP
===================================================== */

.map-shell{
  padding:14px;
}

#map{
  height:46vh;
  min-height:360px;
  max-height:540px;

  border-radius:24px;
  overflow:hidden;

  border:1px solid #cbc7bb;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:7px;

  margin-top:9px;
}


/* =====================================================
   MARKERS
===================================================== */

.ym{
  background:transparent;
  border:0;
}

.mw{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.dot{
  width:30px;
  height:30px;

  border-radius:50%;

  display:grid;
  place-items:center;

  color:#fff;

  font-size:9px;
  font-weight:800;

  border:2px solid #fff;

  box-shadow:0 3px 10px #0003;
}

.dot.normal{
  width:22px;
  height:22px;

  background:var(--normal);

  font-size:0;
}

.dot.normal::after{
  content:"";

  width:7px;
  height:7px;

  background:white;

  border-radius:50%;
}

.dot.partner{
  background:var(--partner);
}

.dot.brand{
  background:var(--brand);

  border-radius:8px;
}

.dot.special{
  background:var(--special);

  border-radius:8px;

  transform:rotate(45deg);
}

.dot.special span{
  transform:rotate(-45deg);

  font-size:12px;
}

.mname{
  margin-top:3px;

  background:#fffdf8ee;

  padding:3px 6px;

  border-radius:7px;

  font-size:9px;
  font-weight:700;

  white-space:nowrap;

  box-shadow:0 1px 5px #00000012;
}

.bottari-map{
  margin-top:2px;

  background:#253830;
  color:#fff;

  padding:3px 7px;

  border-radius:999px;

  font-size:8px;
  font-weight:800;

  white-space:nowrap;
}


/* =====================================================
   JOURNEY
===================================================== */

.route{
  position:sticky;
  top:0;

  z-index:1200;

  margin:0 14px 14px;

  padding:10px 12px;

  background:rgba(251,247,238,.97);

  border:1px solid var(--line);
  border-radius:0 0 20px 20px;

  box-shadow:0 8px 22px #25383014;

  backdrop-filter:blur(12px);
}

.route-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;
}

.route-title{
  display:flex;
  align-items:center;

  gap:8px;

  min-width:0;
}

.route h2{
  margin:0;

  font:500 19px Georgia,serif;

  white-space:nowrap;
}

.route-count{
  min-width:24px;
  height:24px;

  display:inline-grid;
  place-items:center;

  border-radius:999px;

  background:var(--ink);
  color:#fff;

  font-size:10px;
  font-weight:800;
}

.route-toggle{
  flex:0 0 auto;

  padding:7px 10px;
}

.route p{
  margin:8px 0;

  color:#657069;

  font-size:10px;
  line-height:1.5;
}

.stops{
  display:flex;
  gap:6px;

  overflow-x:auto;

  min-height:34px;

  padding:4px 0 2px;

  scrollbar-width:none;
}

.stops::-webkit-scrollbar{
  display:none;
}

.stop{
  padding:7px 9px;

  white-space:nowrap;
}

.stop b{
  display:inline-grid;
  place-items:center;

  width:17px;
  height:17px;

  margin-right:5px;

  border-radius:50%;

  background:var(--ink);
  color:#fff;

  font-size:9px;
}

.empty{
  padding:7px 2px;

  color:var(--muted);

  font-size:10px;

  white-space:nowrap;
}

.route-details{
  overflow:hidden;

  max-height:260px;

  opacity:1;

  transition:
  max-height .2s ease,
  opacity .2s ease;
}

.route.collapsed .route-details{
  max-height:0;

  opacity:0;
}

.route.collapsed{
  padding-bottom:8px;
}

.route .actions{
  margin-top:8px;
}


/* =====================================================
   CARDS
===================================================== */

.section{
  padding:4px 14px 32px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:end;

  margin:7px 4px 10px;
}

.head h2{
  margin:0;

  font:500 23px Georgia,serif;
}

.head span{
  color:var(--muted);

  font-size:10px;
}

.cards{
  display:grid;

  gap:10px;
}

.card{
  padding:14px;

  background:#fff;

  border:1px solid var(--line);
  border-radius:18px;
}

.card.partner{
  border-left:4px solid var(--partner);
}

.card.brand{
  border-left:4px solid var(--brand);
}

.card.special{
  border-left:4px solid var(--special);
}

.type{
  color:var(--muted);

  font-size:9px;
  font-weight:800;

  letter-spacing:.12em;
}

.type.partner{
  color:var(--partner);
}

.type.brand{
  color:var(--brand);
}

.type.special{
  color:var(--special);
}

.card h3{
  margin:5px 0;

  font-size:16px;
}

.addr{
  color:var(--muted);

  font-size:10px;
  line-height:1.45;
}

.desc{
  margin-top:6px;

  color:#52605a;

  font-size:11px;
  line-height:1.5;
}

.region-tag{
  display:inline-block;

  margin-top:8px;

  padding:4px 7px;

  border:1px solid var(--line);
  border-radius:999px;

  color:var(--muted);

  font-size:9px;
}

.bottari-card{
  display:inline-block;

  margin-top:8px;

  padding:5px 8px;

  background:#f0e5ce;

  border:1px solid #d8c6a3;
  border-radius:999px;

  color:#544a38;

  font-size:9px;
  font-weight:800;
}

.actions{
  display:flex;
  flex-wrap:wrap;

  gap:6px;

  margin-top:11px;
}

.action{
  padding:8px 10px;

  border-radius:10px;

  text-decoration:none;
}

.action.added{
  background:#e8ecdf;

  border-color:#9da474;
}

.no-result{
  text-align:center;

  padding:26px 16px;

  color:var(--muted);

  font-size:12px;
}


/* =====================================================
   SHEET
===================================================== */

.back{
  display:none;

  position:fixed;
  inset:0;

  z-index:2000;

  background:#18261f55;
}

.back.show{
  display:block;
}

.sheet{
  position:absolute;
  left:50%;
  bottom:0;

  transform:translateX(-50%);

  width:min(900px,100%);

  padding:
  20px
  20px
  max(20px,env(safe-area-inset-bottom));

  background:#fff;

  border-radius:25px 25px 0 0;
}

.sheet h2{
  margin:6px 0;

  font:500 27px Georgia,serif;
}


/* =====================================================
   FULL MAP
===================================================== */

.map-full{
  position:fixed!important;

  inset:0!important;

  z-index:3000!important;

  padding:0!important;

  background:#fff!important;
}

.map-full #map{
  height:100vh!important;

  max-height:none!important;

  border-radius:0;
}

.map-full .toolbar{
  position:absolute;

  z-index:3100;

  left:10px;
  bottom:18px;

  padding:7px;

  background:#ffffffe6;

  border-radius:14px;
}


/* =====================================================
   MOBILE / DESKTOP
===================================================== */

@media(min-width:700px){

  .cards{
    grid-template-columns:1fr 1fr;
  }

  #map{
    height:570px;
  }

}

</style>
</head>

/* =====================================================
   STATE
===================================================== */

let filter='all';

let region='all';

let search='';

let ids=[];

let line=null;

let markers={};



/* =====================================================
   LOAD JOURNEY
===================================================== */

try{

  const params=
  new URLSearchParams(
    location.search
  );

  const shared=
  params.get('journey');


  if(shared){

    ids=
    shared
    .split(',')
    .filter(
      id=>P.some(
        p=>p.id===id
      )
    );

  }else{

    ids=
    JSON.parse(
      localStorage.getItem('yr')
      ||
      '[]'
    );

  }

}catch(e){

  ids=[];

}


ids=
ids.filter(
  id=>P.some(
    p=>p.id===id
  )
);

/* =====================================================
   MARKER
===================================================== */

function icon(p){

  let cls=p.cat;

  let inn='';


  if(p.special){

    cls='special';

    inn='<span>◆</span>';

  }else if(p.cat==='partner'){

    inn=p.badge || 'Y';

  }else if(p.cat==='brand'){

    inn=p.badge || 'B';

  }


  return L.divIcon({

    className:'ym',

    html:`
    <div class="mw">

      <div class="dot ${cls}">
        ${inn}
      </div>

      <div class="mname">
        ${p.name}
      </div>

      ${
        p.bottari
        ?
        '<div class="bottari-map">요가보따리 HERE</div>'
        :
        ''
      }

    </div>
    `,

    iconSize:[120,52],

    iconAnchor:[60,27]

  });

}



P.forEach(p=>{

  const m=
  L.marker(
    p.c,
    {
      icon:icon(p)
    }
  );


  m.on(
    'click',
    ()=>openP(p)
  );


  markers[p.id]=m;

});



/* =====================================================
   VISIBLE PLACES
===================================================== */

function visiblePlaces(){

  const q=
  search
  .trim()
  .toLowerCase();


  return P.filter(p=>{


    const typeOK=

    filter==='all'

    ||

    (
      filter==='bottari'
      ?
      p.bottari
      :
      p.cat===filter
    );


    const regionOK=

    region==='all'

    ||

    p.region===region;


    const text=
    [
      p.name,
      p.addr,
      p.region,
      p.type,
      p.desc
    ]
    .join(' ')
    .toLowerCase();


    const searchOK=

    !q

    ||

    text.includes(q);


    return (
      typeOK
      &&
      regionOK
      &&
      searchOK
    );

  });

}



/* =====================================================
   APPLY MARKERS
===================================================== */

function apply(){

  group.clearLayers();


  visiblePlaces()
  .forEach(
    p=>
    group.addLayer(
      markers[p.id]
    )
  );

}

   SAVE JOURNEY
===================================================== */

function save(){

  localStorage.setItem(

===================================================== */

function stops(){

  const e=
  document.getElementById(
    'stops'
  );


  document
  .getElementById(
    'routeCount'
  )
  .textContent=
  ids.length;


  if(!ids.length){

    e.innerHTML=`

    <div class="empty">
      요가원 카드에서 ‘Journey에 담기’를 눌러주세요.
    </div>

    `;

    return;

  }


  e.innerHTML=

  ids.map((id,i)=>{

    const p=
    P.find(
      x=>x.id===id
    );

    return `

    <button
      class="stop"
      data-rm="${id}">

      <b>
        ${i+1}
      </b>

      ${p.name} ×

    </button>

    `;

  })
  .join('');


  e
  .querySelectorAll(
    '[data-rm]'
  )
  .forEach(x=>{

    x.onclick=()=>{

      toggle(
        x.dataset.rm
      );

    };

  });

}



/* =====================================================
   DRAW ROUTE
===================================================== */

function draw(fit=1){

  if(line){

    map.removeLayer(line);

    line=null;

  }


  if(ids.length<2){

    return;

  }


  line=
  L.polyline(

    ids.map(
      id=>
      P.find(
        p=>p.id===id
      ).c
    ),

    {
      color:'#253830',
      weight:5,
      opacity:.82,
      dashArray:'9 7'
    }

  )
  .addTo(map);


  if(fit){

    map.fitBounds(

      line.getBounds(),

      {
        padding:[55,55],
        maxZoom:13
      }

    );

  }

}



/* =====================================================
   TOGGLE JOURNEY
===================================================== */

function toggle(id){

  const i=
  ids.indexOf(id);


  if(i>=0){

    ids.splice(
      i,
      1
    );

  }else{

    ids.push(id);

  }


  save();

  stops();

  cards();

  draw(1);

}

/* =====================================================

===================================================== */

function fitVisible(){

  const a=
  visiblePlaces();


  if(!a.length){

    return;

  }


  if(a.length===1){

    map.flyTo(
      a[0].c,
      14
    );

    return;

  }


  map.fitBounds(

    a.map(
      p=>p.c
    ),

    {
      padding:[40,40],
      maxZoom:12
    }

  );

}

/* =====================================================
   LOCATION
===================================================== */

document
.getElementById(
  'loc'
)
.onclick=()=>{

  if(!navigator.geolocation){

    alert(
      '위치 기능을 사용할 수 없습니다.'
    );

    return;

  }


  navigator
  .geolocation
  .getCurrentPosition(

    q=>{

      const me=[
        q.coords.latitude,
        q.coords.longitude
      ];


      map.flyTo(
        me,
        14
      );


      const nearest=

      [...P]

      .map(p=>({

        ...p,

        distance:
        map.distance(
          me,
          p.c
        )

      }))

      .sort(
        (a,b)=>
        a.distance-b.distance
      )[0];


      if(nearest){

        setTimeout(
          ()=>openP(nearest),
          500
        );

      }

    },

    ()=>{

      alert(
        '위치 권한을 허용해주세요.'
      );

    }

  );

};

/* =====================================================
   NAVER ROUTE
===================================================== */

document
.getElementById(
  'naverRoute'
)
.onclick=()=>{

  if(ids.length<2){

    alert(
      '최소 2곳을 Journey에 담아주세요.'
    );

    return;

  }


  if(ids.length>7){

    alert(
      '길찾기는 출발지와 도착지를 포함해 최대 7곳까지만 선택해주세요.'
    );

    return;

  }


  const a=
  ids.map(
    id=>
    P.find(
      p=>p.id===id
    )
  );


  const start=
  a[0];


  const dest=
  a[a.length-1];


  const q=
  new URLSearchParams();


  q.set(
    'slat',
    start.c[0]
  );

  q.set(
    'slng',
    start.c[1]
  );

  q.set(
    'sname',
    start.name
  );


  q.set(
    'dlat',
    dest.c[0]
  );

  q.set(
    'dlng',
    dest.c[1]
  );

  q.set(
    'dname',
    dest.name
  );


  a
  .slice(1,-1)
  .forEach((p,i)=>{

    const n=
    i+1;


    q.set(
      `v${n}lat`,
      p.c[0]
    );

    q.set(
      `v${n}lng`,
      p.c[1]
    );

    q.set(
      `v${n}name`,
      p.name
    );

  });


  q.set(
    'appname',
    'com.yogibara.map'
  );


  const appUrl=

  'nmap://route/car?'

  +

  q.toString();


  const fallback=

  'https://map.naver.com/p/directions';


  let hidden=false;


  const onVis=()=>{

    if(document.hidden){

      hidden=true;

    }

  };


  document
  .addEventListener(
    'visibilitychange',
    onVis,
    {
      once:true
    }
  );


  window.location.href=
  appUrl;


  setTimeout(()=>{

    if(
      !hidden
      &&
      document.visibilityState==='visible'
    ){

      window.location.href=
      fallback;

    }

  },1400);

};



/* =====================================================
   SHARE JOURNEY
===================================================== */

document
.getElementById(
  'shareRoute'
)
.onclick=async()=>{

  if(!ids.length){

    alert(
      '먼저 Journey에 장소를 담아주세요.'
    );

    return;

  }


  const url=
  new URL(
    location.href
  );


  url.searchParams.set(
    'journey',
    ids.join(',')
  );


  const places=

  ids

  .map(
    id=>
    P.find(
      p=>p.id===id
    ).name
  )

  .join(' → ');


  const shareData={

    title:
    'YOGIBARA · JEJU YOGA JOURNEY',

    text:
    `나의 제주 요가여행\n${places}`,

    url:
    url.toString()

  };


  try{


    if(navigator.share){

      await navigator.share(
        shareData
      );

    }else if(
      navigator.clipboard
    ){

      await navigator
      .clipboard
      .writeText(
        url.toString()
      );


      alert(
        'Journey 링크를 복사했습니다.'
      );

    }else{

      prompt(
        '아래 링크를 복사해주세요.',
        url.toString()
      );

    }


  }catch(e){

    /* 공유 취소 */

  }

};



/* =====================================================
   FULL MAP
===================================================== */

document
.getElementById(
  'full'
)
.onclick=()=>{

  const s=
  document.querySelector(
    '.map-shell'
  );


  s.classList.toggle(
    'map-full'
  );


  document
  .getElementById(
    'full'
  )
  .textContent=

  s.classList.contains(
    'map-full'
  )

  ?

  '작게 보기'

  :

  '지도 크게 보기';


  setTimeout(
    ()=>map.invalidateSize(),
    100
  );

};



/* =====================================================
   CLOSE SHEET
===================================================== */

document
.getElementById(
  'back'
)
.onclick=e=>{

  if(
    e.target.id==='back'
  ){

    e.currentTarget
    .classList
    .remove(
      'show'
    );

  }

};

===================================================== */

cards();

stops();

draw(0);


map.fitBounds(

  bounds,

  {
    padding:[10,10]
  }

);


setTimeout(
  ()=>map.invalidateSize(),
  200
);

</script>
