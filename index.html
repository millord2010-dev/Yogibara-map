<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YOGIBARA MAP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f5f0e6;--paper:#fffdf8;--ink:#253830;--muted:#778079;--line:#ddd6c7;--partner:#3f7467;--brand:#bd7957;--anand:#776b91}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.app{max-width:900px;margin:auto;background:var(--paper);min-height:100vh}header{padding:24px 18px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000;background:rgba(255,253,248,.96);backdrop-filter:blur(10px)}
.kicker{font-size:10px;font-weight:800;letter-spacing:.22em;color:var(--muted)}h1{font:500 34px Georgia,serif;margin:7px 0 4px}.sub{font-size:12px;color:var(--muted);line-height:1.5}
.filters{display:flex;gap:7px;overflow:auto;margin-top:14px}.pill,.btn,.action,.stop{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 12px;font-size:11px;cursor:pointer}
.pill.active,.btn.primary,.action.dark{background:var(--ink);color:#fff;border-color:var(--ink)}.map-shell{padding:14px}#map{height:46vh;min-height:360px;max-height:540px;border-radius:24px;overflow:hidden;border:1px solid #cbc7bb}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.ym{background:transparent;border:0}.mw{display:flex;flex-direction:column;align-items:center}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:white;font-size:10px;font-weight:800;border:2px solid white;box-shadow:0 3px 10px #0003}.dot.partner{background:var(--partner)}.dot.brand{background:var(--brand)}.dot.anand{background:var(--anand);border-radius:8px;transform:rotate(45deg)}.dot.anand span{transform:rotate(-45deg);font-size:12px}.mname{margin-top:3px;background:#fffdf8ee;padding:3px 6px;border-radius:7px;font-size:10px;font-weight:700;white-space:nowrap}.bottari-map{margin-top:2px;background:#253830;color:#fff;padding:3px 7px;border-radius:999px;font-size:8px;font-weight:800;white-space:nowrap;letter-spacing:.02em}.bottari-card{display:inline-block;margin-top:8px;background:#f0e5ce;border:1px solid #d8c6a3;color:#544a38;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:800}
.section{padding:4px 14px}.head{display:flex;justify-content:space-between;align-items:end;margin:7px 4px 10px}.head h2,.route h2{font:500 23px Georgia,serif;margin:0}.head span{font-size:10px;color:var(--muted)}
.cards{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.type{font-size:9px;letter-spacing:.14em;font-weight:800;color:var(--muted)}.card h3{font-size:16px;margin:5px 0}.addr,.desc{font-size:10px;color:var(--muted);line-height:1.45}.desc{font-size:11px;color:#52605a;margin-top:6px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.action{border-radius:10px;padding:8px 10px;text-decoration:none}.action.added{background:#e5efe9;border-color:#8aa99a}
.route{margin:14px;border:1px solid var(--line);border-radius:20px;background:#fbf7ee;padding:15px}.route p{font-size:11px;color:#657069;line-height:1.55}.stops{display:flex;gap:7px;overflow:auto;min-height:38px}.stop b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;margin-right:5px}.empty{font-size:10px;color:var(--muted);padding:10px 2px}
.back{position:fixed;inset:0;background:#18261f55;display:none;z-index:2000}.back.show{display:block}.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(900px,100%);background:#fff;border-radius:25px 25px 0 0;padding:20px}.sheet h2{font:500 27px Georgia,serif;margin:6px 0}
.map-full{position:fixed!important;inset:0!important;z-index:3000!important;background:#fff!important;padding:0!important}.map-full #map{height:100vh!important;max-height:none!important;border-radius:0}.map-full .toolbar{position:absolute;z-index:3100;left:10px;bottom:18px;background:#ffffffe6;padding:7px;border-radius:14px}
@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}#map{height:570px}}
</style></head><body>
<div class="app"><header><div class="kicker">PRACTICE · SHARE · PEACE</div><h1>YOGIBARA MAP</h1><div class="sub">수련은, 나에게서 끝나지 않는다.<br>제주의 수련 공간과 나눔을 잇는 지도</div>
<div class="filters"><button class="pill active" data-f="all">ALL</button><button class="pill" data-f="partner">YOGIBARA PARTNER</button><button class="pill" data-f="brand">BRAND PARTNER</button><button class="pill" data-f="bottari">요가보따리</button></div></header>
<div class="map-shell"><div id="map"></div><div class="toolbar"><button class="btn primary" id="fit">제주 전체 보기</button><button class="btn" id="loc">내 위치</button><button class="btn" id="routeView">여행 동선 보기</button><button class="btn" id="full">지도 크게 보기</button></div></div>
<div class="section"><div class="head"><h2>Partners</h2><span id="count"></span></div><div class="cards" id="cards"></div></div>
<div class="route"><h2>Jeju Yoga Journey</h2><p>가고 싶은 곳을 방문 순서대로 선택하세요. 2곳 이상 선택하면 지도에 동선이 연결됩니다.</p><div class="stops" id="stops"></div><div class="actions"><button class="btn primary" id="showRoute">지도에 동선 표시</button><button class="btn" id="clearRoute">동선 비우기</button><button class="btn" id="googleRoute">선택 동선 Google Maps</button></div></div></div>
<div class="back" id="back"><div class="sheet"><div class="type" id="sType"></div><h2 id="sName"></h2><div class="addr" id="sAddr"></div><div class="desc" id="sDesc"></div><div class="actions" id="sActions"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const P=[
{id:'anand',name:'아난드요가',cat:'partner',special:1,bottari:1,badge:'',type:'YOGIBARA PARTNER',addr:'제주특별자치도 제주시 한라대학로 107 202호',c:[33.476477052022,126.48176932399],ig:'https://www.instagram.com/anande_yoga/',desc:'요기바라와 함께하는 파트너 요가원.'},
{id:'yogaroum',name:'요가로움',cat:'partner',badge:'01',type:'YOGIBARA PARTNER · 01',addr:'제주특별자치도 제주시 우정로11길 21',c:[33.4920,126.4296],ig:'https://www.instagram.com/yogaroum.jeju/',desc:'요가로 나눔을 함께 실천하는 요기바라 파트너 01.'},
{id:'yoga12',name:'요가열두달',cat:'partner',badge:'02',type:'YOGIBARA PARTNER · 02',addr:'제주특별자치도 제주시 중앙로 567',c:[33.4704,126.5469],ig:'https://www.instagram.com/yoga_12month/',desc:'제주 아라동에서 수련과 나눔을 이어가는 요기바라 파트너 02.'},
{id:'aewol7',name:'애월7일요가원',cat:'partner',badge:'03',type:'YOGIBARA PARTNER · 03',addr:'제주특별자치도 제주시 애월읍 납읍로4길 29',c:[33.4375,126.3302],ig:'https://www.instagram.com/aewol_7th_yoga/',desc:'애월에서 수련과 나눔을 이어가는 요기바라 파트너 03.'},
{id:'prajna',name:'쁘라즈나요가',cat:'partner',badge:'04',type:'YOGIBARA PARTNER · 04',addr:'제주특별자치도 제주시 아봉로 34 2층',c:[33.4767,126.5567],ig:'https://www.instagram.com/pprajna_yoga/',desc:'기부 하타요가를 통해 수련의 마음을 나눔으로 이어간 요기바라 파트너 04.'},
{id:'comfort',name:'컴포트플로우',cat:'brand',bottari:1,badge:'B',type:'BRAND PARTNER',addr:'제주특별자치도 제주시 전농로9길 20 1층',c:[33.50618,126.52105],ig:'https://www.instagram.com/comfortflow_jeju/',desc:'요기바라와 기부 프로젝트를 함께하는 제주 로컬 브랜드.'}
];
let filter='all',ids=[],line=null,markers={};try{ids=JSON.parse(localStorage.getItem('yr')||'[]')}catch(e){}ids=ids.filter(x=>P.some(p=>p.id===x));
const map=L.map('map',{minZoom:9,maxZoom:19}).setView([33.385,126.545],10);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const group=L.layerGroup().addTo(map),bounds=L.latLngBounds([[33.105,126.12],[33.565,126.96]]);
function icon(p){let cls=p.special?'anand':p.cat,inn=p.special?'<span>◆</span>':p.badge;return L.divIcon({className:'ym',html:`<div class="mw"><div class="dot ${cls}">${inn}</div><div class="mname">${p.name}</div>${p.bottari?'<div class="bottari-map">요가보따리 HERE</div>':''}</div>`,iconSize:[110,50],iconAnchor:[55,28]})}
P.forEach(p=>{let m=L.marker(p.c,{icon:icon(p)});m.on('click',()=>openP(p));markers[p.id]=m;group.addLayer(m)});
function apply(){group.clearLayers();P.filter(p=>filter==='all'||(filter==='bottari'?p.bottari:p.cat===filter)).forEach(p=>group.addLayer(markers[p.id]))}
function save(){localStorage.setItem('yr',JSON.stringify(ids))}
function cards(){let a=P.filter(p=>filter==='all'||(filter==='bottari'?p.bottari:p.cat===filter)),b=document.getElementById('cards');document.getElementById('count').textContent=a.length+' places';b.innerHTML=a.map(p=>`<div class="card"><div class="type">${p.type}</div><h3>${p.name}</h3><div class="addr">${p.addr}</div><div class="desc">${p.desc}</div>${p.bottari?'<div class="bottari-card">요가보따리 HERE</div>':''}<div class="actions"><button class="action dark" data-open="${p.id}">지도에서 보기</button>${p.ig?`<a class="action" href="${p.ig}" target="_blank">Instagram</a>`:''}<button class="action ${ids.includes(p.id)?'added':''}" data-add="${p.id}">${ids.includes(p.id)?'✓ 동선에 추가됨':'＋ 동선에 추가'}</button></div></div>`).join('');b.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>focus(P.find(p=>p.id===x.dataset.open)));b.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>toggle(x.dataset.add));apply()}
function stops(){let e=document.getElementById('stops');if(!ids.length){e.innerHTML='<div class="empty">파트너 카드에서 ‘동선에 추가’를 눌러주세요.</div>';return}e.innerHTML=ids.map((id,i)=>{let p=P.find(x=>x.id===id);return `<button class="stop" data-rm="${id}"><b>${i+1}</b>${p.name} ×</button>`}).join('');e.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>toggle(x.dataset.rm))}
function draw(fit=1){if(line){map.removeLayer(line);line=null}if(ids.length<2)return;line=L.polyline(ids.map(id=>P.find(p=>p.id===id).c),{color:'#253830',weight:5,opacity:.82,dashArray:'9 7'}).addTo(map);if(fit)map.fitBounds(line.getBounds(),{padding:[55,55],maxZoom:13})}
function toggle(id){let i=ids.indexOf(id);i>=0?ids.splice(i,1):ids.push(id);save();stops();cards();draw(1)}
function focus(p){map.flyTo(p.c,16);setTimeout(()=>openP(p),300)}
function openP(p){document.getElementById('sType').textContent=p.type;document.getElementById('sName').textContent=p.name;document.getElementById('sAddr').textContent=p.addr;document.getElementById('sDesc').textContent=p.desc;document.getElementById('sActions').innerHTML=`<a class="action dark" target="_blank" href="https://map.naver.com/p/search/${encodeURIComponent(p.name+' '+p.addr)}">네이버지도</a>${p.ig?`<a class="action" target="_blank" href="${p.ig}">Instagram</a>`:''}<button class="action ${ids.includes(p.id)?'added':''}" id="sheetAdd">${ids.includes(p.id)?'✓ 동선에 추가됨':'＋ 동선에 추가'}</button>`;document.getElementById('sheetAdd').onclick=()=>{toggle(p.id);openP(p)};document.getElementById('back').classList.add('show')}
document.querySelectorAll('.pill').forEach(x=>x.onclick=()=>{document.querySelectorAll('.pill').forEach(y=>y.classList.remove('active'));x.classList.add('active');filter=x.dataset.f;cards();if(filter==='all')map.fitBounds(bounds,{padding:[10,10]});else{let a=P.filter(p=>filter==='bottari'?p.bottari:p.cat===filter);map.fitBounds(a.map(p=>p.c),{padding:[40,40],maxZoom:12})}});
document.getElementById('fit').onclick=()=>{filter='all';document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('active',x.dataset.f==='all'));cards();map.fitBounds(bounds,{padding:[10,10]})};
document.getElementById('loc').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(q=>map.flyTo([q.coords.latitude,q.coords.longitude],15),()=>alert('위치 권한을 허용해주세요.')):alert('위치 기능을 사용할 수 없습니다.');
document.getElementById('showRoute').onclick=()=>ids.length<2?alert('최소 2곳을 선택해주세요.'):draw(1);document.getElementById('routeView').onclick=()=>ids.length<2?alert('최소 2곳을 선택해주세요.'):draw(1);
document.getElementById('clearRoute').onclick=()=>{ids=[];save();stops();cards();if(line){map.removeLayer(line);line=null}};
document.getElementById('googleRoute').onclick=()=>{if(ids.length<2){alert('최소 2곳을 선택해주세요.');return}let a=ids.map(id=>P.find(p=>p.id===id));let coord=p=>`${p.c[0]},${p.c[1]}`;let u=`https://www.google.com/maps/dir/?api=1&origin=${coord(a[0])}&destination=${coord(a[a.length-1])}&travelmode=driving`;if(a.length>2)u+=`&waypoints=${a.slice(1,-1).map(coord).join('%7C')}`;window.open(u,'_blank')};
document.getElementById('full').onclick=()=>{let s=document.querySelector('.map-shell');s.classList.toggle('map-full');document.getElementById('full').textContent=s.classList.contains('map-full')?'작게 보기':'지도 크게 보기';setTimeout(()=>map.invalidateSize(),100)};
document.getElementById('back').onclick=e=>{if(e.target.id==='back')e.currentTarget.classList.remove('show')};
cards();stops();draw(0);map.fitBounds(bounds,{padding:[10,10]});setTimeout(()=>map.invalidateSize(),200);
</script></body></html>
