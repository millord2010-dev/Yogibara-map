<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ea">
  <title>주문 완료 · YOGIBARA</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f2ea;
      --card: #fffdf8;
      --ink: #24231f;
      --muted: #777168;
      --sage: #66735a;
      --line: #ddd7cc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 520px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(40, 39, 34, .08);
    }
    .mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #dfe5d8;
      color: var(--sage);
      font-size: 28px;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: .18em;
      color: var(--sage);
      font-weight: 700;
    }
    h1 {
      font-size: clamp(27px, 7vw, 36px);
      line-height: 1.35;
      margin: 14px 0;
    }
    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.85;
      margin: 10px 0;
    }
    a {
      display: inline-block;
      margin-top: 22px;
      padding: 14px 24px;
      background: var(--sage);
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 700;
    }
    @media (max-width: 420px) {
      main { padding: 40px 22px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <div class="eyebrow">YOGIBARA · YOGA BOTTARI</div>
    <h1>주문이 정상적으로 접수되었습니다</h1>
    <p>요기바라와 함께해주셔서 감사합니다.</p>
    <p>입금이 완료되면 주문 내용을 확인한 뒤 문자로 안내드릴게요.</p>
    <a href="https://yogibara-map.vercel.app/">요기바라로 돌아가기</a>
  </main>
</body>
</html>
