<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17120d">
<title>YOGIBARA V19</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0f0c09;overflow:hidden}
#appFrame{display:block;width:min(100%,430px);height:100dvh;margin:0 auto;border:0;background:#17120d}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#17120d;color:#f7efe5;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px;z-index:5}
</style>
</head>
<body>
<div id="loading">YOGIBARA를 여는 중…</div>
<iframe id="appFrame" src="./app-18.html" title="YOGIBARA" allow="web-share; geolocation; clipboard-write; clipboard-read"></iframe>
<script>
const frame=document.getElementById('appFrame');
const loading=document.getElementById('loading');
const ENHANCEMENT="(function(){\n  const VERSION='V19';\n\n  function byId(id){return document.getElementById(id)}\n  function formatStartMonth(dateStr){\n    if(!dateStr)return '';\n    const m=/^(\\d{4})-(\\d{2})/.exec(dateStr);\n    return m?`기록 시작 · ${m[1]}년 ${Number(m[2])}월`:'';\n  }\n\n  // 1) 기록 공개 범위: 공개 / 나만 보기\n  const entryDateEl=byId('entryDate');\n  if(entryDateEl && !byId('entryVisibility')){\n    const holder=document.createElement('div');\n    holder.className='privacyChoice';\n    holder.innerHTML='공개 범위<select id=\"entryVisibility\"><option value=\"public\">공개 · 연결된 사람에게 보여요</option><option value=\"private\">나만 보기 · 다른 사람에게 숨겨요</option></select><div class=\"privateNote\">나만 보기 기록은 내 홈과 기록 목록에서만 확인할 수 있고, 공개 카드에는 사용되지 않습니다.</div>';\n    entryDateEl.closest('label').insertAdjacentElement('afterend',holder);\n  }\n\n  const originalOpenEntry=openEntry;\n  openEntry=function(type){\n    originalOpenEntry(type);\n    const v=byId('entryVisibility'); if(v)v.value='public';\n  };\n\n  byId('saveEntryBtn').onclick=()=>{\n    const type=byId('entryType').value,date=byId('entryDate').value||todayISO();\n    let e={id:Date.now(),type,date,private:byId('entryVisibility')?.value==='private'};\n    if(type==='practice'){\n      e.kind=byId('practiceKind').value;e.min=Math.max(1,Number(byId('practiceMin').value)||60);e.place=byId('practicePlace').value.trim();e.note=byId('practiceNote').value.trim();\n    } else if(type==='spend'){\n      e.amount=Math.max(0,Number(byId('spendAmount').value)||0);e.category=byId('spendCategory').value;e.item=byId('spendItem').value.trim();e.note=byId('spendNote').value.trim();\n    } else if(type==='place'){\n      e.place=byId('placeName').value.trim();e.region=byId('placeRegion').value.trim();e.note=byId('placeNote').value.trim();\n    } else if(type==='share'){\n      e.kind=byId('shareKind').value;e.name=byId('shareName').value.trim();e.amount=Math.max(0,Number(byId('shareAmount').value)||0);e.note=byId('shareNote').value.trim();\n    }\n    state.entries.push(e);save();closeSheet('entrySheet');renderAll();go('home');\n  };\n\n  window.toggleEntryPrivacy=(id)=>{\n    const e=state.entries.find(x=>x.id===id);if(!e)return;\n    e.private=!e.private;save();renderAll();\n  };\n\n  entryHtml=function(e){\n    const lock=e.private?'<span class=\"tag private\">🔒 나만 보기</span>':'<span class=\"tag\">공개</span>';\n    const privacyBtn=`<button class=\"privacyMini\" onclick=\"toggleEntryPrivacy(${e.id})\">${e.private?'공개로 바꾸기':'나만 보기'}</button>`;\n    if(e.type==='practice') return `<div class=\"entry card\"><div class=\"entryTop\"><div><b>${esc(e.kind)} · ${e.min}분</b><small>${esc(e.date)}${e.place?' · '+esc(e.place):''}</small></div><div class=\"tagRow\">${lock}<span class=\"tag\">수련</span>${privacyBtn}</div></div>${e.note?`<p>${esc(e.note)}</p>`:''}</div>`;\n    if(e.type==='spend') return `<div class=\"entry card\"><div class=\"entryTop\"><div><b>${esc(e.item||e.category)} · ${won(e.amount)}</b><small>${esc(e.date)} · ${esc(e.category)}</small></div><div class=\"tagRow\">${lock}<span class=\"tag money\">지출</span>${privacyBtn}</div></div>${e.note?`<p>${esc(e.note)}</p>`:''}</div>`;\n    if(e.type==='place') return `<div class=\"entry card\"><div class=\"entryTop\"><div><b>${esc(e.place||'새로운 장소')}</b><small>${esc(e.date)}${e.region?' · '+esc(e.region):''}</small></div><div class=\"tagRow\">${lock}<span class=\"tag place\">장소</span>${privacyBtn}</div></div>${e.note?`<p>${esc(e.note)}</p>`:''}</div>`;\n    return `<div class=\"entry card\"><div class=\"entryTop\"><div><b>${esc(e.kind)}</b><small>${esc(e.date)}${e.name?' · '+esc(e.name):''}</small></div><div class=\"tagRow\">${lock}<span class=\"tag share\">나눔</span>${privacyBtn}</div></div>${e.amount?`<div class=\"tagRow\"><span class=\"tag money\">${won(e.amount)}</span></div>`:''}${e.note?`<p>${esc(e.note)}</p>`:''}</div>`;\n  };\n\n  // 공개 카드에는 공개 기록만 사용\n  latestCardData=function(){\n    const sorted=state.entries.filter(e=>!e.private).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);\n    const share=sorted.find(e=>e.type==='share');\n    if(share)return {kind:'나눔',title:'오늘의 마음이 누군가에게 이어졌습니다.',body:share.name?`${share.name}에서 이어진 나눔의 기록입니다.`:'나의 요가생활이 한 번 더 나눔으로 연결되었습니다.',meta:`${share.date} · ${share.kind||'나눔'}`};\n    const practice=sorted.find(e=>e.type==='practice');\n    if(practice)return {kind:'수련',title:'오늘도 나를 위한 시간을 만들었습니다.',body:practice.place?`${practice.place}에서 ${practice.kind} ${practice.min}분.`:`${practice.kind} ${practice.min}분의 수련을 남겼습니다.`,meta:`${practice.date} · MY YOGA LIFE`};\n    const place=sorted.find(e=>e.type==='place');\n    if(place)return {kind:'여정',title:'나의 요가여정에 새로운 장소가 생겼습니다.',body:place.place?`${place.place}${place.region?' · '+place.region:''}`:'새로운 공간을 기록했습니다.',meta:`${place.date} · MY JOURNEY`};\n    const spend=sorted.find(e=>e.type==='spend');\n    if(spend)return {kind:'요가생활',title:'내가 좋아하는 요가생활을 하나 더 모았습니다.',body:`${spend.category}${spend.item?' · '+spend.item:''}`,meta:`${spend.date} · MY YOGA LIFE`};\n    return null;\n  };\n\n  // 2) 다른 사람 프로필 + 내 프로필에 기록 시작 년/월 표시\n  const personBio=byId('personBio');\n  if(personBio && !byId('personSince')){\n    const el=document.createElement('div');el.id='personSince';el.className='profileSince';personBio.insertAdjacentElement('afterend',el);\n  }\n  const myBio=byId('myBio');\n  if(myBio && !byId('mySince')){\n    const el=document.createElement('div');el.id='mySince';el.className='profileSince';myBio.insertAdjacentElement('afterend',el);\n  }\n\n  const originalRenderPerson=renderPerson;\n  renderPerson=function(){\n    originalRenderPerson();\n    const p=currentPerson();\n    const publicPractices=(p.practices||[]).filter(x=>!x.private);\n    const first=publicPractices.map(x=>x.date).filter(Boolean).sort()[0];\n    byId('personSince').textContent=formatStartMonth(first)||'기록 시작일 미표시';\n    byId('personPracticeList').innerHTML=publicPractices.length?publicPractices.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class=\"entry card\"><b>${esc(x.text)}</b><small>${esc(x.date)}</small></div>`).join(''):'<div class=\"empty card\">공개한 수련 기록이 없습니다.</div>';\n  };\n\n  const originalRenderMy=renderMy;\n  renderMy=function(){\n    originalRenderMy();\n    const first=state.entries.map(e=>e.date).filter(Boolean).sort()[0];\n    byId('mySince').textContent=formatStartMonth(first)||'첫 기록을 남기면 시작 월이 표시됩니다.';\n  };\n\n  // 3) 가짜 지도를 실제 움직이는 Leaflet 지도 + 방문 기록 핀으로 교체\n  let journeyLeafletMap=null, journeyLayer=null, journeyRenderToken=0;\n  const knownCoords={\n    '요가로움':[33.4920,126.4296],\n    '요가열두달':[33.4704,126.5469],\n    '애월7일요가원':[33.4375,126.3302],\n    '쁘라즈나요가':[33.4767,126.5567],\n    '바라보다요가':[33.5000,126.6600],\n    '아난드요가':[33.476477052022,126.48176932399],\n    '제주':[33.385,126.545],\n    '제주시':[33.4996,126.5312],\n    '애월':[33.450,126.320]\n  };\n  function loadGeoCache(){try{return JSON.parse(localStorage.getItem('yogibara_geo_v19')||'{}')}catch(e){return {}}}\n  function saveGeoCache(c){try{localStorage.setItem('yogibara_geo_v19',JSON.stringify(c))}catch(e){}}\n  async function geocodePlace(name){\n    const exact=knownCoords[name];if(exact)return exact;\n    const cache=loadGeoCache();if(cache[name])return cache[name];\n    try{\n      const q=encodeURIComponent(name+' 대한민국');\n      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ko&q=${q}`);\n      if(!r.ok)return null;\n      const data=await r.json();\n      if(data&&data[0]){const c=[Number(data[0].lat),Number(data[0].lon)];cache[name]=c;saveGeoCache(cache);return c;}\n    }catch(e){}\n    return null;\n  }\n  function ensureJourneyMap(){\n    const el=byId('journeyMap'); if(!el||!window.L)return null;\n    if(!journeyLeafletMap){\n      el.innerHTML='';\n      el.style.background='#d9d1bf';\n      el.classList.add('journeyMapWrap');\n      journeyLeafletMap=L.map(el,{zoomControl:true,minZoom:3,maxZoom:19}).setView([33.385,126.545],9);\n      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(journeyLeafletMap);\n      journeyLayer=L.layerGroup().addTo(journeyLeafletMap);\n    }\n    setTimeout(()=>journeyLeafletMap.invalidateSize(),80);\n    return journeyLeafletMap;\n  }\n  renderJourney=function(){\n    const counts={};\n    state.entries.forEach(e=>{\n      const p=(e.type==='practice'||e.type==='place')?e.place:'';if(!p)return;\n      if(!counts[p])counts[p]={count:0,last:e.date};counts[p].count++;if(e.date>counts[p].last)counts[p].last=e.date;\n    });\n    const arr=Object.entries(counts).sort((a,b)=>b[1].count-a[1].count);\n    byId('journeyCount').textContent=arr.length+'곳';\n    byId('journeyList').innerHTML=arr.length?arr.map(([name,v])=>`<div class=\"spaceCard card\"><div class=\"spaceTop\"><div><h3>${esc(name)} · ${v.count}회</h3><p>최근 기록 ${esc(v.last)}</p></div><span class=\"normalBadge\">${v.count===1?'첫 기록':v.count+'회'}</span></div></div>`).join(''):'<div class=\"empty card\">수련이나 장소를 남기면 여정이 자동으로 만들어집니다.</div>';\n    const map=ensureJourneyMap();if(!map)return;\n    journeyLayer.clearLayers();\n    const token=++journeyRenderToken;\n    if(!arr.length){map.setView([33.385,126.545],9);return;}\n    Promise.all(arr.map(async([name,v])=>({name,v,c:await geocodePlace(name)}))).then(items=>{\n      if(token!==journeyRenderToken)return;\n      const points=[];\n      items.forEach(({name,v,c})=>{\n        if(!c)return;points.push(c);\n        L.circleMarker(c,{radius:9,weight:3,color:'#f7efe5',fillColor:'#7b8a34',fillOpacity:1}).bindPopup(`<b>${esc(name)}</b><br>방문 기록 ${v.count}회<br>최근 ${esc(v.last)}`).addTo(journeyLayer);\n      });\n      if(points.length===1)map.setView(points[0],14);\n      else if(points.length>1)map.fitBounds(points,{padding:[28,28],maxZoom:13});\n      else map.setView([33.385,126.545],9);\n      setTimeout(()=>map.invalidateSize(),80);\n    });\n  };\n\n  // 4) YOGIBARA CARD를 1080×1920 이미지로 만들고 이미지 파일로 공유\n  function roundedRect(ctx,x,y,w,h,r){\n    ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();\n  }\n  function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){\n    const chars=[...String(text||'')];let line='',lines=[];\n    chars.forEach(ch=>{const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch}else line=test});\n    if(line)lines.push(line);lines=lines.slice(0,maxLines);\n    lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lineHeight));\n    return y+lines.length*lineHeight;\n  }\n  function makeStoryCanvas(){\n    const c=latestCardData();if(!c)throw new Error('공개 기록이 없습니다.');\n    const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const ctx=canvas.getContext('2d');\n    const bg=ctx.createLinearGradient(0,0,0,1920);bg.addColorStop(0,'#201810');bg.addColorStop(1,'#120e0a');ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1920);\n    ctx.fillStyle='rgba(123,138,52,.16)';ctx.beginPath();ctx.arc(930,180,280,0,Math.PI*2);ctx.fill();\n    ctx.fillStyle='#f4ecdf';ctx.font='700 82px Georgia, serif';ctx.fillText('YOGIBARA',82,165);\n    ctx.fillStyle='#c2b29e';ctx.font='500 30px sans-serif';ctx.fillText('수련은, 나에게서 끝나지 않는다.',86,218);\n    roundedRect(ctx,72,410,936,1000,58);ctx.fillStyle='#f2eadc';ctx.fill();\n    ctx.fillStyle='#7b6a50';ctx.font='800 28px sans-serif';ctx.fillText(`YOGIBARA CARD · ${c.kind}`,132,505);\n    ctx.fillStyle='#342b22';ctx.font='700 66px sans-serif';let y=wrapText(ctx,c.title,132,625,810,86,4);\n    ctx.fillStyle='#6f6252';ctx.font='500 38px sans-serif';y=wrapText(ctx,c.body,132,y+70,810,58,5);\n    ctx.fillStyle='#776956';ctx.font='700 30px sans-serif';ctx.fillText(c.meta,132,1272);\n    ctx.fillStyle='#7b8a34';roundedRect(ctx,132,1320,360,8,4);ctx.fill();\n    ctx.fillStyle='#c2b29e';ctx.font='500 28px sans-serif';ctx.fillText(`@${state.profile.name.replace(/\\s+/g,'').toLowerCase()}`,86,1665);\n    ctx.fillStyle='#f7efe5';ctx.font='800 30px sans-serif';ctx.fillText('PRACTICE · SHARE · PEACE',86,1730);\n    ctx.fillStyle='#8f806e';ctx.font='500 24px sans-serif';ctx.fillText('YOGIBARA',86,1782);\n    return canvas;\n  }\n  function dataUrlToFile(dataUrl,name){\n    const parts=dataUrl.split(','),mime=(parts[0].match(/:(.*?);/)||[])[1]||'image/png';\n    const bin=atob(parts[1]);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);\n    return new File([bytes],name,{type:mime});\n  }\n  function cardFilename(){const c=latestCardData();return `YOGIBARA_story_${(c?.meta||todayISO()).slice(0,10)}.png`;}\n  window.downloadYogibaraCard=()=>{\n    try{\n      const url=makeStoryCanvas().toDataURL('image/png');const a=document.createElement('a');a.href=url;a.download=cardFilename();document.body.appendChild(a);a.click();a.remove();\n    }catch(e){alert(e.message||'이미지를 만들 수 없습니다.');}\n  };\n  window.shareYogibaraCard=()=>{\n    try{\n      const dataUrl=makeStoryCanvas().toDataURL('image/png');const file=dataUrlToFile(dataUrl,cardFilename());\n      if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){\n        navigator.share({files:[file],title:'YOGIBARA CARD'}).catch(e=>{if(e&&e.name!=='AbortError')alert('공유창을 열지 못했습니다. 이미지 저장을 이용해주세요.');});\n        return;\n      }\n      const a=document.createElement('a');a.href=dataUrl;a.download=cardFilename();document.body.appendChild(a);a.click();a.remove();\n      alert('스토리용 이미지를 저장했습니다. Instagram 스토리에서 이미지를 불러와 올려주세요.');\n    }catch(e){alert(e.message||'공유할 수 없습니다.');}\n  };\n\n  const originalRenderHome=renderHome;\n  renderHome=function(){\n    originalRenderHome();\n    const card=latestCardData();if(!card)return;\n    const actions=document.querySelector('#homeShareCard .cardActions');\n    if(actions){\n      actions.className='cardActions story';\n      actions.innerHTML='<button class=\"pill\" onclick=\"downloadYogibaraCard()\">이미지 저장</button><button class=\"pill primary\" onclick=\"shareYogibaraCard()\">스토리에 공유</button>';\n      const help=document.createElement('div');help.className='storyHelp';help.textContent='공유창에서 Instagram을 선택한 뒤 스토리로 올리세요. 이제 텍스트가 아니라 1080×1920 PNG 이미지로 공유됩니다.';actions.insertAdjacentElement('afterend',help);\n    }\n  };\n\n  // 기존 기록은 기본 공개로 유지\n  state.entries.forEach(e=>{if(typeof e.private!=='boolean')e.private=false});save();\n  renderAll();\n  setTimeout(()=>{try{renderJourney()}catch(e){}},150);\n})();\n";
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    if(!d)return;
    const leafletCss=d.createElement('link');leafletCss.rel='stylesheet';leafletCss.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';d.head.appendChild(leafletCss);
    const style=d.createElement('style');
    style.textContent=`
      #journeyMap{height:300px!important;background:#d9d1bf!important;isolation:isolate}
      #journeyMap .leaflet-control-attribution{font-size:7px}
      #journeyMap .leaflet-control-zoom a{color:#3a3027}
      .profileSince{margin-top:9px;color:#d8c8b5;font-size:10px;font-weight:700;letter-spacing:.02em}
      .privacyChoice{margin-top:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.05);color:var(--muted);font-size:10px;font-weight:800}
      .privacyChoice select{width:100%;margin-top:6px;border:1px solid rgba(255,255,255,.08);background:var(--soft);color:#342b22;border-radius:13px;padding:10px 11px}
      .tag.private{background:#4a4137;color:#f3e8d8}
      .privacyMini{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#e7dac8;border-radius:999px;padding:4px 7px;font-size:8px;white-space:nowrap}
      .storyHelp{margin-top:8px;color:var(--muted);font-size:9px;line-height:1.5}
      .cardActions.story{display:grid;grid-template-columns:1fr 1.2fr;gap:8px}
      .cardActions.story button{width:100%;min-width:0}
      .journeyMapWrap{position:relative}
    `;d.head.appendChild(style);
    const inject=()=>{const s=d.createElement('script');s.textContent=ENHANCEMENT;d.body.appendChild(s);};
    const leafletJs=d.createElement('script');leafletJs.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';leafletJs.onload=inject;leafletJs.onerror=inject;d.head.appendChild(leafletJs);
    loading.style.display='none';
  }catch(err){loading.textContent='앱을 불러오지 못했습니다. 새로고침해 주세요.';console.error(err);}
});
</script>
</body>
</html>
